name: Indian paper trial

on:
  schedule:
    # UTC: 09:17 / 09:32 and 17:17 / 17:47 IST, weekdays.
    # Actual start can be delayed by GitHub. Python checks the exchange calendar.
    - cron: '47 3,11 * * 1-5'
    - cron: '2 4 * * 1-5'
    - cron: '17 12 * * 1-5'
  workflow_dispatch:
    inputs:
      action:
        description: 'Bootstrap once; tick, pause or resume thereafter'
        type: choice
        options: [tick, bootstrap, pause, resume]
        default: tick

permissions:
  contents: write

concurrency:
  group: indian-paper-account
  cancel-in-progress: false

jobs:
  paper:
    # Do not publish account reports or execute from an unintended branch.
    if: github.event.repository.private == true && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_STATE_TOKEN: ${{ github.token }}
      PAPER_STATE: .hosted-state
      ACTION: ${{ inputs.action || 'tick' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify software
        run: python -m unittest discover -s tests -v
      - name: Restore persistent account
        id: restore
        run: |
          if [ "$ACTION" = bootstrap ]; then
            python deploy/state.py restore --state "$PAPER_STATE" --bootstrap
          else
            python deploy/state.py restore --state "$PAPER_STATE"
          fi
      - name: Run paper worker
        id: worker
        continue-on-error: true
        run: |
          if [ "$ACTION" = bootstrap ]; then
            python cloud.py setup --state "$PAPER_STATE"
          else
            python cloud.py "$ACTION" --state "$PAPER_STATE"
          fi
      - name: Persist ledger and outgoing alerts before sending
        id: save
        if: always() && steps.restore.outcome == 'success'
        run: python deploy/state.py persist --state "$PAPER_STATE"
      - name: Send email alerts
        id: email
        if: steps.save.outcome == 'success'
        continue-on-error: true
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: python cloud.py send --state "$PAPER_STATE"
      - name: Persist delivery receipts
        if: always() && steps.save.outcome == 'success'
        run: python deploy/state.py persist --state "$PAPER_STATE"
      - name: Show private run report
        if: always() && steps.save.outcome == 'success'
        run: cat "$PAPER_STATE/REPORT.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Report failures to GitHub
        if: always() && (steps.worker.outcome == 'failure' || steps.email.outcome == 'failure')
        run: exit 1
